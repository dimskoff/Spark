[package]
name = "spark-reflect"
description = "Spark Engine reflection: dynamic Value, field metadata (range, unit, doc, default) and get/set by path with validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["derive"]
# Re-exports `#[derive(Reflect)]` and `#[derive(ReflectEnum)]`.
derive = ["dep:spark-reflect-derive"]
# `ReflectField` for glam `Vec2` / `Vec3` / `Vec4` (like `[f32; N]`) and `Quat` (Euler angles in degrees).
glam = ["dep:glam"]

[dependencies]
spark-reflect-derive = { workspace = true, optional = true }
glam = { workspace = true, optional = true }
