name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Licenses of all dependencies must be on the allow list in deny.toml; bans and sources are checked too.
  deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, exe: spark.exe }
          - { name: linux-x64, os: ubuntu-latest, exe: spark }
          - { name: macos-arm64, os: macos-latest, exe: spark }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # audio (alsa, dbus via cpal), gamepads (udev), keyboard (xkbcommon), software Vulkan for headless tests
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libdbus-1-dev pkg-config mesa-vulkan-drivers

      - name: Format
        run: cargo fmt --all --check

      # No lint is allowed globally: a clippy warning fails CI. A justified exception lives next to the code
      # as `#[allow(clippy::...)] // reason`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --workspace

      - name: Test
        run: cargo test --release --workspace

      # Also part of the workspace run above; named separately so a stale THIRD_PARTY_LICENSES.md is easy to spot.
      # Fix: `cargo run -p licenses` and commit the result.
      - name: Third-party licenses are up to date
        run: cargo test --release -p licenses

      - name: Examples (spark check every example, run the scenario test)
        shell: bash
        run: |
          for d in examples/[0-9]*/ examples/showcase/*/ examples/demo; do
            target/release/${{ matrix.exe }} check "$d" --frames 90 --json > /dev/null || { echo "example failed: $d"; target/release/${{ matrix.exe }} check "$d" --frames 90; exit 1; }
          done

      # The golden images were made on a desktop GPU; software Vulkan (lavapipe) renders slightly differently, so this
      # step only reports for now. Regenerate on CI hardware (spark golden <dir> --update) to make it blocking.
      - name: Golden screenshots (tolerant, report only)
        shell: bash
        continue-on-error: true
        run: |
          for d in examples/[0-9]*/ examples/showcase/*/; do
            target/release/${{ matrix.exe }} golden "$d" --golden "examples/_golden/$(basename $d).png" --frames 40 --size 480x270 --tolerance 0.05 --max-bad 0.15
          done

      - name: spark check (template game)
        shell: bash
        run: |
          target/release/${{ matrix.exe }} new "$RUNNER_TEMP/ci-game"
          target/release/${{ matrix.exe }} check "$RUNNER_TEMP/ci-game" --frames 120 --json

      - uses: actions/upload-artifact@v4
        with:
          name: spark-${{ matrix.name }}
          path: |
            target/release/${{ matrix.exe }}
            LICENSE
            THIRD_PARTY_LICENSES.md
            README.md
